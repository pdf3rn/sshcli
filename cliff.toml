[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}{% if commit.breaking %} [breaking]{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v?[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Added", default_bump = "minor" },
  { message = "^fix", group = "Fixed", default_bump = "patch" },
  { message = "^security", group = "Security", default_bump = "patch" },
  { message = "^perf", group = "Changed", default_bump = "patch" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|ci|style|test|chore)", skip = true },
]
