[workspace]
resolver = "2"
members = ["crates/core", "crates/gui"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "Cross-platform SSH client with a desktop GUI"

[workspace.dependencies]
directories = "6.0"
keyring = "3.6"
portable-pty = "0.9"
russh = "0.54"
russh-sftp = "2.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
